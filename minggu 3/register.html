<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border border-slate-200">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Form Registrasi</h2>

        <!-- Action diarahkan ke dashboard.html -->
        <form id="registerForm" action="dashboard.html" method="GET" class="space-y-4">
            
            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-username" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-password" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Nama -->
            <div>
                <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-nama" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Tanggal Lahir -->
            <div>
                <label for="tgl_lahir" class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
                <input type="date" id="tgl_lahir" name="tgl_lahir" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-tgl_lahir" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Alamat -->
            <div>
                <label for="alamat" class="block text-sm font-medium text-slate-700 mb-1">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <p id="error-alamat" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Nomor Telpon -->
            <div>
                <label for="telepon" class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon</label>
                <input type="text" id="telepon" name="telepon" placeholder="Contoh: 628123456789" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-telepon" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 mt-2">
                Daftar Sekarang
            </button>
        </form>
    </div>

    <!-- Memanggil script validasi JavaScript -->
    <script src="validasi_input.js"></script>
</body>
</html>
