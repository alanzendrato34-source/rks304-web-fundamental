<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans flex flex-col min-h-screen">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-indigo-600">AdminPanel</h1>
        <div class="text-sm text-slate-600">Halo, Admin</div>
    </header>

    <div class="flex flex-1">
        <aside class="w-64 bg-slate-900 text-slate-300 p-4">
            <nav class="space-y-2">
                <a href="dashboard.html" class="block px-4 py-2.5 rounded-lg bg-indigo-600 text-white">Dashboard</a>
                <a href="products.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white">Products</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white">Users</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white">Settings</a>
                <a href="index.html" class="block px-4 py-2.5 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white mt-8 transition">Logout</a>
            </nav>
        </aside>

        <main class="flex-1 p-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Dashboard Statistik</h2>
            <!-- 4 Cards E-Commerce -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="text-sm text-slate-500 font-medium">Total Penjualan</div>
                    <div class="text-2xl font-bold text-slate-800 mt-2">Rp 45.200.000</div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="text-sm text-slate-500 font-medium">Total Pesanan</div>
                    <div class="text-2xl font-bold text-slate-800 mt-2">1,240</div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="text-sm text-slate-500 font-medium">Jumlah Pelanggan</div>
                    <div class="text-2xl font-bold text-slate-800 mt-2">850</div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="text-sm text-slate-500 font-medium">Stok Produk</div>
                    <div class="text-2xl font-bold text-slate-800 mt-2">320 Item</div>
                </div>
            </div>
        </main>
    </div>

    <footer class="bg-white border-t p-4 text-center text-sm text-slate-500">
        &copy; 2026 Admin Panel. All rights reserved.
    </footer>
</body>
</html>
